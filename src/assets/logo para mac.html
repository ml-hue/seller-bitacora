<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Consulting × TOKGOL - Wallpaper HD</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 2880px;
            height: 1800px;
            overflow: hidden;
            background: linear-gradient(135deg, #4A7FE8 0%, #6B9DF5 20%, #8BB5FF 40%, #B5D3FF 60%, #D5E5FF 80%, #E8F0FA 100%);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Líneas diagonales decorativas del fondo */
        .bg-lines {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            opacity: 0.4;
        }

        .line {
            position: absolute;
            width: 250%;
            height: 3px;
            background: linear-gradient(90deg, 
                transparent 0%, 
                rgba(255, 255, 255, 0.2) 20%,
                rgba(255, 255, 255, 0.35) 50%, 
                rgba(255, 255, 255, 0.2) 80%,
                transparent 100%);
            transform: rotate(-25deg);
            transform-origin: center;
        }

        .line:nth-child(1) { 
            top: 15%; 
            left: -50%; 
            filter: blur(1px);
        }
        .line:nth-child(2) { 
            top: 30%; 
            left: -50%; 
            opacity: 0.8;
        }
        .line:nth-child(3) { 
            top: 45%; 
            left: -50%; 
            opacity: 0.6;
            filter: blur(2px);
        }
        .line:nth-child(4) { 
            top: 60%; 
            left: -50%; 
            opacity: 0.5;
        }
        .line:nth-child(5) { 
            top: 75%; 
            left: -50%; 
            opacity: 0.4;
            filter: blur(1px);
        }

        /* Efectos de brillo ambiental */
        .ambient-glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
        }

        .glow-1 {
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(74, 127, 232, 0.6) 0%, transparent 70%);
            top: 20%;
            left: 15%;
        }

        .glow-2 {
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.4) 0%, transparent 70%);
            bottom: 15%;
            right: 20%;
        }

        /* Contenedor principal */
        .container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 150px;
            z-index: 10;
        }

        /* Sección Seller Consulting */
        .seller-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            animation: fadeInLeft 1s ease-out;
        }

        .seller-logo-container {
            position: relative;
            filter: drop-shadow(0 30px 60px rgba(36, 99, 235, 0.3));
        }

        .seller-logo-container img {
            width: 320px;
            height: 320px;
            display: block;
        }

        .seller-text-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .seller-text {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            font-size: 84px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.98);
            letter-spacing: 3px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .consulting-text {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            font-size: 42px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.85);
            letter-spacing: 12px;
            text-transform: uppercase;
        }

        /* Divisor vertical */
        .divider {
            width: 2px;
            height: 400px;
            background: linear-gradient(180deg, 
                transparent 0%, 
                rgba(255, 255, 255, 0.4) 20%,
                rgba(255, 255, 255, 0.5) 50%, 
                rgba(255, 255, 255, 0.4) 80%,
                transparent 100%);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        /* Sección TOKGOL */
        .tokgol-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 45px;
            animation: fadeInRight 1s ease-out;
        }

        .tokgol-logo-container {
            position: relative;
            filter: drop-shadow(0 25px 50px rgba(33, 37, 41, 0.15));
        }

        .tokgol-logo-container img {
            width: 300px;
            height: auto;
            display: block;
        }

        /* Animaciones */
        @keyframes fadeInLeft {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes fadeInRight {
            from {
                opacity: 0;
                transform: translateX(50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* Efecto de luz sutil en el centro */
        .center-light {
            position: absolute;
            width: 1000px;
            height: 1000px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.08) 0%, transparent 60%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
<body>
    <!-- Efectos de fondo -->
    <div class="bg-lines">
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
    </div>

    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>
    <div class="center-light"></div>

    <!-- Contenedor principal -->
    <div class="container">
        <!-- Seller Consulting -->
        <div class="seller-section">
            <div class="seller-logo-container">
                <img src="/mnt/user-data/uploads/logo-seller.png" alt="Seller Consulting Logo">
            </div>
            <div class="seller-text-group">
                <div class="seller-text">Seller</div>
                <div class="consulting-text">CONSULTING</div>
            </div>
        </div>

        <!-- Divisor -->
        <div class="divider"></div>

        <!-- TOKGOL -->
        <div class="tokgol-section">
            <div class="tokgol-logo-container">
                <img src="/mnt/user-data/uploads/Tokgol_-_Vertical_Dark.jpg" alt="TOKGOL Logo">
            </div>
        </div>
    </div>

    <script>
        // Añadir un efecto de pulso sutil al cargar
        window.addEventListener('load', () => {
            document.querySelectorAll('.seller-logo-container, .tokgol-logo-container').forEach(el => {
                el.style.animation = 'fadeInLeft 1s ease-out forwards';
            });
        });
    </script>
</body>
</html>
